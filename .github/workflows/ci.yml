name: Checks
on: [push, pull_request]
jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: https://api.example.test
          VITE_SUPABASE_URL: https://auth.example.test
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_fixture
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: kanji_test
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: kanji_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kanji_test -d kanji_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://kanji_test:local-test-only@127.0.0.1:5432/kanji_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: ruff check . ../scripts
      - run: python -m pytest -q
      - run: python -m app.seed --mode validate
      - run: python -m alembic upgrade head --sql
