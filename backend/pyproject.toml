[project]
name = "kanji-connection-backend"
version = "0.2.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi==0.162.5",
    "uvicorn==0.54.0",
    "pydantic==2.14.3",
    "pydantic-settings==2.16.2",
    "SQLAlchemy==2.1.8",
    "psycopg[binary]==3.3.9",
    "PyJWT[crypto]==2.15.1",
    "httpx==0.28.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
[tool.ruff]
line-length = 100
target-version = "py310"

[tool.vercel]
entrypoint = "index:app"
